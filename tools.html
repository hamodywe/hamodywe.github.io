<!doctype html>
<html lang="en" dir="ltr">
<head>
<title>Tools — hamodywe</title>
<meta name="description" content="Static analysers that find silent failures in CI, deploys, tests and AI agent tooling.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/motion.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f5f4e'/><text x='16' y='23' font-size='19' font-family='monospace' font-weight='700' fill='%23fff' text-anchor='middle'>h</text></svg>">
<script>
  (() => {
    const t = localStorage.getItem('theme');
    if (t) document.documentElement.dataset.theme = t;
    const lang = localStorage.getItem('lang') || ((navigator.language || '').startsWith('ar') ? 'ar' : 'en');
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  })();
</script>
</head>
<body>
<div class="progress" aria-hidden="true"></div>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="index.html"><span class="brand-mark">h</span><span>hamodywe</span></a>
    <nav class="top-nav" aria-label="Sections">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="tools.html" data-i18n="nav.tools">Tools</a>
      <a href="contributions.html" data-i18n="nav.contributions">Contributions</a>
      <a href="index.html#contact" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="tools">
      <button class="chip" id="lang-toggle" type="button" aria-label="Switch language">العربية</button>
      <button class="chip" id="theme-toggle" type="button" aria-label="Switch theme">◐</button>
    </div>
  </div>
</header>

<main id="main">
  <section class="page-head wrap">
    <h1 id="page-title"></h1>
    <p id="page-sub"></p>
    <div class="stats" id="stats"></div>
  </section>

  <section class="sec wrap">
    <div class="kinds" id="kinds" role="group"></div>
    <div class="filters">
      <input type="search" id="q" autocomplete="off">
      <div id="tags" role="group"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden data-i18n="work.empty">Nothing matches that filter.</p>
  </section>
</main>

<dialog class="detail" id="detail" aria-labelledby="detail-title">
  <button class="detail-close" type="button" id="detail-close" aria-label="Close">✕</button>
  <div class="detail-in" id="detail-in"></div>
</dialog>
<footer class="wrap">
  <span id="foot-left"></span>
  <span><a href="admin.html" data-i18n="foot.dashboard">Dashboard</a></span>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="assets/js/tools.js"></script>
</body>
</html>
